name: Commit and push to main
description: >
  Commit the given paths as github-actions[bot] and push them to main, rebasing
  onto whatever main has become while the caller was validating. Callers must
  check out with fetch-depth: 0, because a shallow clone has no merge base to
  rebase onto, and must only run this when the paths actually changed.
inputs:
  message:
    description: Commit message
    required: true
  paths:
    description: Whitespace-separated list of paths to commit
    required: true
runs:
  using: composite
  steps:
    - name: Commit and push to main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MESSAGE: ${{ inputs.message }}
        PATHS: ${{ inputs.paths }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        gh auth setup-git

        # PATHS is word-split on purpose: it carries a list of paths.
        # shellcheck disable=SC2086
        git commit --message "$MESSAGE" -- $PATHS

        # The whole rebase-and-push cycle is retried, not just the rebase: main
        # can move again between the fetch and the push, which rejects the push
        # even though the rebase itself succeeded. Only the release caller is
        # unattended in a way that matters -- by the time it reaches this step
        # it has already published the release, its assets, and the packages, so
        # losing a push race here would redden a release that fully succeeded.
        for attempt in 1 2 3; do
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::error::main moved with a conflicting change; resolve it by hand"
            exit 1
          fi
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "push rejected on attempt ${attempt}; main moved again"
          sleep $((attempt * 5))
        done

        echo "::error::could not push to main after 3 attempts"
        exit 1
