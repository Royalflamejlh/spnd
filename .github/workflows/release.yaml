name: tagpr

on:
  push:
    branches:
      - main
  # Toggling tagpr:minor / tagpr:major labels on the release PR should update
  # its proposed version right away, instead of waiting for the next push to
  # main to make tagpr recompute it.
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency: release-tagpr

jobs:
  tagpr:
    # Label events only matter on tagpr's own release PR; skip the rest so
    # ordinary PR labeling doesn't spend runner time.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      # persist-credentials stays on (default) so tagpr can push the release PR and tag
      # ref: main because on pull_request events the default checkout is the
      # PR merge ref, while tagpr always operates on the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The release jobs below run in this workflow instead of a tag-triggered one
  # because tags pushed with GITHUB_TOKEN do not trigger `on: push: tags`
  # workflows. They run only when tagpr just tagged a release-PR merge, and
  # check out that tag explicitly. To retry a failed release, re-run only the
  # failed jobs: a full re-run finds no new tag and skips everything.
  build-native-packages:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/build-native.yaml
    with:
      ref: ${{ needs.tagpr.outputs.tag }}
      fetch-depth: 0
      matrix: |
        [
          {"name": "build-linux-arm64",   "os": "ubuntu-24.04-arm", "platform": "linux",  "arch": "arm64", "binary": "result/bin/spnd"},
          {"name": "build-linux-x64",     "os": "ubuntu-24.04",     "platform": "linux",  "arch": "x64",   "binary": "result/bin/spnd"},
          {"name": "build-mac-arm64",     "os": "macos-15",         "platform": "darwin", "arch": "arm64", "binary": "result/bin/spnd"},
          {"name": "build-mac-x64",       "os": "macos-15",         "platform": "darwin", "arch": "x64",   "binary": "result/bin/spnd"},
          {"name": "build-windows-arm64", "os": "windows-11-arm",   "platform": "win32",  "arch": "arm64", "binary": "rust/target/release/spnd.exe"},
          {"name": "build-windows-x64",   "os": "windows-2025",     "platform": "win32",  "arch": "x64",   "binary": "rust/target/release/spnd.exe"}
        ]

  npm:
    needs:
      - tagpr
      - build-native-packages
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: lts/*
          package-manager-cache: false
      # node comes from setup-node above (needed for the npm registry auth);
      # Nushell package checks bring Nu through their Nix shebangs. `publint` is
      # the flake's own pinned build, invoked by every package's prepack script.
      - run: nix profile install --inputs-from . nixpkgs#pnpm .#publint
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      # Authenticates via npm trusted publishing (OIDC), which is why this job
      # holds `id-token: write` and no NPM_TOKEN: each package names this
      # workflow file as its trusted publisher on npmjs.com. Moving this step
      # into another workflow file would change the OIDC claim and be rejected,
      # so it stays here rather than in the shared build workflow.
      - run: pnpm --filter='./apps/spnd' --filter='./packages/ccusage-*' publish --provenance --no-git-checks --access public

  # Smoke-tests what users actually install: `npm install -g` of the freshly
  # published package on each supported OS, which is the only check that
  # exercises the launcher resolving its platform-specific native dependency.
  # A broken manifest (unresolved `workspace:*` specifiers, a missing native
  # package) installs cleanly and only fails when the binary is invoked, so
  # running the CLI here is the point. No checkout: the working directory stays
  # empty so each runner behaves like a real end user.
  e2e:
    name: e2e ${{ matrix.os }}
    needs:
      - tagpr
      - npm
    if: needs.tagpr.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Install the published package and exercise it
        shell: pwsh
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
          LOG_LEVEL: '0'
        run: |
          $version = $env:TAG -replace '^v', ''
          # Retried with backoff because this job starts the moment `npm`
          # finishes, and the registry CDN routinely trails a publish by tens of
          # seconds. Without this the release goes red on propagation lag rather
          # than on anything actually wrong with the package.
          $installed = $false
          foreach ($attempt in 1..5) {
            npm install -g "@spnd/spnd@$version"
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            $delay = 10 * $attempt
            Write-Host "install attempt $attempt failed; retrying in ${delay}s (registry may not have propagated)"
            Start-Sleep -Seconds $delay
          }
          if (-not $installed) { throw 'npm install -g failed after 5 attempts' }
          spnd --version
          if ($LASTEXITCODE -ne 0) { throw '--version failed' }
          # A minimal fixture so the report commands have something to summarize.
          $dir = Join-Path $env:RUNNER_TEMP 'e2e/projects/e2e-project/e2e-session'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $usage = '"usage":{"input_tokens":100,"output_tokens":50,"cache_creation_input_tokens":25,"cache_read_input_tokens":10}'
          $message = '"message":{"role":"assistant","id":"e2e-msg","model":"claude-sonnet-4-20250514",' + $usage + '}'
          $line = '{"timestamp":"2026-01-01T10:00:00.000Z","sessionId":"e2e-session",' + $message + ',"requestId":"e2e-req","costUSD":0.12,"version":"1.0.0"}'
          Set-Content -Path (Join-Path $dir 'chat.jsonl') -Value $line
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'e2e'
          foreach ($cmd in 'daily', 'monthly', 'session') {
            spnd $cmd --offline | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "spnd $cmd failed" }
            spnd $cmd --offline --json | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8'))"
            if ($LASTEXITCODE -ne 0) { throw "spnd $cmd --json produced invalid JSON" }
            Write-Host "ok: $cmd"
          }

  # Deliberately independent of `npm`: a registry outage or a rejected publish
  # must not also withhold the GitHub release, the deb/rpm assets, and the brew
  # and scoop manifests. Each publish target fails on its own.
  release:
    needs:
      - tagpr
      - build-native-packages
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # changelogithub resolves the release tag with `git tag --points-at HEAD`,
      # so checking out the tag is what makes it pick the right release.
      # persist-credentials stays off; commit-and-push-main authenticates with
      # the job token through gh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      # zip and nfpm are used by scripts/package-release-assets.nu.
      - run: nix profile install --inputs-from . nixpkgs#zip nixpkgs#nfpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      - name: Package release assets
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: scripts/package-release-assets.nu --version "${TAG#v}"
      - run: nix run .#changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
      - name: Update Homebrew formula and Scoop manifest
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: scripts/update-packaging-manifests.nu --version "${TAG#v}"
      - uses: ./.github/actions/commit-and-push-main
        with:
          message: 'chore(packaging): point brew and scoop at ${{ needs.tagpr.outputs.tag }}'
          paths: Formula/spnd.rb bucket/spnd.json
