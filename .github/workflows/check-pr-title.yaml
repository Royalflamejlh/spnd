name: Check PR title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `tagpr` replaces upstream's `autorelease: pending`, which came from
          # release-please and matched nothing here. tagpr's own release pull
          # request already gets a Conventional Commits title from
          # .github/tagpr-template.md, so this is a safety net rather than the
          # thing that makes it pass.
          ignoreLabels: |
            tagpr
            dependencies
