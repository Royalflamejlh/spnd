name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-slim
    outputs:
      code-changed: ${{ steps.detect.outputs.code-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-code-changes

  # Single gate for the cheap-but-high-signal checks, in fail-fast order:
  # secret detection (gitleaks), workflow/format lint (the treefmt check, which
  # runs actionlint + zizmor with the repo's exact ignore config), then the
  # tirith repository scan (https://tirith.sh/docs/ci/). Everything heavier
  # `needs` this job, so a failure here costs no build or test time.
  #
  # tirith is installed from the flake's pinned nixpkgs so CI matches the dev
  # shell. The scan and its SARIF upload share one job: upstream split them so
  # the `security-events: write` scope never sat in a job running PR-controlled
  # code. That split bought nothing here, because GitHub already withholds the
  # scope from fork pull requests entirely (see the upload step below), so the
  # only thing it added was a job handoff.
  preflight:
    name: security & lint preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - name: Secret scan and workflow lint
        run: nix build --print-build-logs .#checks.x86_64-linux.gitleaks .#checks.x86_64-linux.treefmt
      - name: Install tirith
        run: nix profile install --inputs-from . nixpkgs#tirith
      # One pass produces the SARIF report and sets the gate exit code. tirith's
      # `--ci` exit code is: 0 = no findings, 1 = findings at/above --fail-on,
      # 2 = findings present but all below it. We capture it (rather than letting
      # it abort the step) so the SARIF still uploads before the gate decides.
      #
      # `*.snap` are excluded: they are terminal snapshot test fixtures that
      # intentionally contain ANSI escape sequences, so the `ansi_escapes` rule
      # (High) fires on them as a false positive. The rule stays active for real
      # source files; we only skip the test data.
      - name: Scan repository with tirith
        id: scan
        run: |
          set +e
          tirith scan --ci --fail-on high --exclude '*.snap' --format sarif ./ > results.sarif
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "tirith exited ${code}"
      - name: Summarize findings
        if: always()
        run: |
          count="$(jq '[.runs[].results[]?] | length' results.sarif 2>/dev/null || echo 0)"
          echo "tirith reported ${count} finding(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[]? | "- [\(.level // "warning")] \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri)"' \
            results.sarif 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      # Published before the gate step so findings reach the Security tab even
      # when the gate then blocks the PR.
      #
      # Skipped for pull requests from forks: GitHub caps their GITHUB_TOKEN at
      # read-only across every scope, so the `security-events: write` permission
      # above is not actually granted and the upload would 403. Failing here
      # would redden `preflight`, and with it every job that needs it, for a
      # reason unrelated to the contributor's change. The findings still reach
      # them through the job summary written above, and the gate below still
      # runs, so a fork pull request is scanned and blocked on real findings
      # exactly like any other -- only the Security tab entry is missing.
      - name: Publish SARIF to the Security tab
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
          category: tirith
      - name: Gate CI on tirith findings
        if: always()
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          case "$SCAN_EXIT" in
            0 | 2)
              echo "tirith gate passed (exit ${SCAN_EXIT}: no findings, or all below 'high')"
              ;;
            1)
              echo "::error::tirith found findings at or above the 'high' threshold; blocking downstream CI"
              exit 1
              ;;
            *)
              echo "::error::tirith scan errored (exit ${SCAN_EXIT}); blocking downstream CI"
              exit 1
              ;;
          esac

  test:
    needs: [changes, preflight]
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - parallel:
          - name: Run nix flake check
            run: nix flake check --print-build-logs
          - name: Run Rust tests
            run: nix build .#ccusage-tests --print-build-logs
          - name: JS test
            run: |
              nix profile install --inputs-from . nixpkgs#pnpm nixpkgs#nodejs nixpkgs#just
              pnpm install --frozen-lockfile
              mkdir -p "$HOME/.claude/projects"
              mkdir -p "$HOME/.config/claude/projects"
              just test-node
          - name: Babashka performance harness test
            run: apps/spnd/scripts/compare-pr-performance_test.clj

  # windows-arm64 is release-only: it is the least-used target and the runner
  # is scarce, so PRs cover the other five and the release build cuts all six.
  build-native-packages:
    needs: [changes, preflight]
    if: needs.changes.outputs.code-changed == 'true'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/build-native.yaml
    with:
      nix-github-token: ${{ github.event_name != 'pull_request' }}
      matrix: |
        [
          {"name": "build-linux-arm64",  "os": "ubuntu-24.04-arm", "platform": "linux",  "arch": "arm64", "binary": "result/bin/spnd"},
          {"name": "build-linux-x64",    "os": "ubuntu-24.04",     "platform": "linux",  "arch": "x64",   "binary": "result/bin/spnd"},
          {"name": "build-mac-arm64",    "os": "macos-15",         "platform": "darwin", "arch": "arm64", "binary": "result/bin/spnd"},
          {"name": "build-mac-x64",      "os": "macos-15",         "platform": "darwin", "arch": "x64",   "binary": "result/bin/spnd"},
          {"name": "build-windows-x64",  "os": "windows-2025",     "platform": "win32",  "arch": "x64",   "binary": "rust/target/release/spnd.exe"}
        ]

  # Publishes an installable preview of the PR to pkg.pr.new, which is also what
  # the perf comparison installs. Both are opt-in per PR via the `perf` label:
  # the preview costs a publish and the comparison builds a 1 GiB fixture, and
  # neither tells you anything about correctness. Add the label to a PR when you
  # want a preview package or a before/after benchmark.
  pkg-pr-new-preview:
    needs:
      - changes
      - build-native-packages
    if: needs.changes.outputs.code-changed == 'true' && contains(github.event.pull_request.labels.*.name, 'perf')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      urls: ${{ steps.publish.outputs.urls }}
      preview-url: ${{ steps.preview-url.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix-cache
      # Packing only repackages the native binaries restored from the build
      # matrix below (no Rust build happens here), so the full `nix develop` dev
      # shell is unnecessary. The package checks bring Nu through their Nix
      # shebangs; `publint` is the flake's own pinned build, invoked by every
      # package's prepack script.
      - run: nix profile install --inputs-from . nixpkgs#pnpm nixpkgs#nodejs .#publint
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      - id: publish
        # Fetched on demand rather than carried as a root devDependency: this
        # job is the only thing that runs it, and it never needs to resolve
        # against the workspace. Renovate does not update `dlx` specifiers, so
        # bump the pin here by hand.
        # continue-on-error: publishing needs the pkg-pr-new GitHub App
        # installed on the repository; without it the preview e2e and perf
        # jobs are skipped instead of failing CI.
        continue-on-error: true
        run: pnpm dlx pkg-pr-new@0.0.75 publish --pnpm --bin './apps/spnd' './packages/ccusage-linux-arm64' './packages/ccusage-linux-x64' './packages/ccusage-darwin-arm64' './packages/ccusage-darwin-x64' './packages/ccusage-win32-x64'
      - name: Warn when the preview publish is unavailable
        if: steps.publish.outcome == 'failure'
        run: >
          echo "::warning::pkg.pr.new publish failed (is the pkg-pr-new GitHub
          App installed on this repository?); the perf job is skipped"
      - id: preview-url
        if: steps.publish.outcome == 'success'
        env:
          URLS: ${{ steps.publish.outputs.urls }}
        run: |
          node <<'JS'
          const urls = (process.env.URLS ?? '').split(/\s+/).filter(Boolean);
          const url = urls.find((value) => /(?:^|\/)spnd@/.test(value));
          if (url == null) {
            throw new Error(`spnd preview URL not found in: ${urls.join(', ')}`);
          }
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          JS

  ccusage-perf-comment:
    name: ccusage ${{ matrix.label }}
    if: github.event_name == 'pull_request' && needs.changes.outputs.code-changed == 'true' && needs.pkg-pr-new-preview.outputs.preview-url != ''
    needs:
      - changes
      - pkg-pr-new-preview
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same benchmark from two entry points, posted as two PR comments:
          # the JS launcher (default runtime) and the bundled Rust native binary.
          - runtime: js
            label: perf comment
            slug: perf-comment
            head-runtime-arg: ''
          - runtime: rust
            label: rust perf comment
            slug: rust-perf-comment
            head-runtime-arg: --head-runtime rust

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-cache
        with:
          # js and rust legs share this job id, so scope the cache per runtime.
          cache-scope: ${{ matrix.runtime }}
      # This job only benchmarks the prebuilt ccusage binary bundled in the
      # installed pkg.pr.new package (no Rust build happens here), so the full
      # `nix develop` dev shell is unnecessary. Install just the tools the perf
      # scripts invoke, pinned to the flake's nixpkgs via `--inputs-from .`.
      - name: Install perf tooling
        run: nix profile install --inputs-from . nixpkgs#just

      - name: Resolve PR preview package URL
        env:
          PKG_PR_NEW_URLS: ${{ needs.pkg-pr-new-preview.outputs.urls }}
        run: |
          preview_url="$(
            printf '%s\n' "$PKG_PR_NEW_URLS" \
              | tr '[:space:]' '\n' \
              | grep -E '(^|/)spnd@' \
              | head -n 1
          )"
          if [ -z "$preview_url" ]; then
            echo "spnd preview URL not found in: $PKG_PR_NEW_URLS" >&2
            exit 1
          fi
          echo "CCUSAGE_PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"

      - name: Generate large ccusage fixture
        run: |
          just generate-large-fixture \
            "$RUNNER_TEMP/ccusage-large-fixture" \
            "$RUNNER_TEMP/ccusage-large-codex-fixture" \
            1024

      - name: Compare performance
        run: |
          apps/spnd/scripts/compare-pr-performance.bb \
            --base-package-url "https://pkg.pr.new/${{ github.repository }}/@spnd/spnd@${{ github.event.pull_request.base.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-dir . \
            --head-package-url "$CCUSAGE_PREVIEW_URL" \
            ${{ matrix.head-runtime-arg }} \
            --fixture-dir apps/spnd/test/fixtures/claude \
            --codex-fixture-dir apps/spnd/test/fixtures/codex \
            --warmup 2 \
            --runs 7 \
            --large-fixture-dir "$RUNNER_TEMP/ccusage-large-fixture" \
            --large-codex-fixture-dir "$RUNNER_TEMP/ccusage-large-codex-fixture" \
            --large-warmup 0 \
            --large-runs 1 \
            --package-runner-timeout-ms 300000 \
            --output "$RUNNER_TEMP/ccusage-${{ matrix.slug }}.md"

      - name: Write job summary
        run: cat "$RUNNER_TEMP/ccusage-${{ matrix.slug }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR comment
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          COMMENT_FILE: ${{ runner.temp }}/ccusage-${{ matrix.slug }}.md
          COMMENT_MARKER: <!-- ccusage-${{ matrix.slug }}:${{ github.event.pull_request.head.sha }} -->
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/upsert-pr-comment.nu

  action-timeline:
    needs:
      - changes
      - preflight
      - test
      - build-native-packages
      - pkg-pr-new-preview
      - ccusage-perf-comment
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - uses: Kesin11/actions-timeline@7bf79990b7c09f5dfb570ac30b814ca597bd538e # v3.1.1

  # Single check for main's branch ruleset to require. Most jobs above are gated
  # on `changes` and are skipped on docs-only pull requests, so requiring them
  # individually would leave those pull requests blocked on checks that never
  # report. A skipped job is fine here; only real failures fail the gate.
  ci-gate:
    name: ci gate
    needs:
      - changes
      - preflight
      - test
      - build-native-packages
      - pkg-pr-new-preview
      - ccusage-perf-comment
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - name: Report job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: echo "$RESULTS"
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
